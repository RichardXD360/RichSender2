<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sender</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .chat{
            position: relative;
            top: 70px;
            max-height: 100%;
            overflow-y:auto;
            overflow-x:hidden;
        }
        main {
         height: calc(100vh - 100px); /* Ajuste conforme necessário */
         overflow-y:auto;
         overflow-x:hidden;
        }
        .chat-container{
            position: relative;
            top: -100px;
            left: 0px;
        }
    </style>
</head>
<body>
    <header>
        <div class="status-circle"></div>
        <h1>Sender Messages</h1>
    </header>
    <main>
        <section style="position: relative; top: -95px; left: -120px;" class="head-content">
            <div class="contact-name">ADM</div>
            <div class="status-circle"></div>
            <div class="status-contact" style="color: black"> Status: Aguardando... </div>
        </section>
        <section class="chat-container">
            <div class="chat">
                <!--Aqui será aplicado todo o main do projeto, interações com chat e envio de mensagens-->
            </div>
        </section>
    </main>
    <footer>
        <div class="input-div">
            <input style="position: relative; transform: scale(1.3); left: 30px; top: 10px; text-align: start;" type="text" class="input-text" placeholder="Digite sua mensagem aqui...">
            <input style="position: relative; left: 180px; top: 10px; transform: scale(1.3);cursor: pointer;" type="button" value="=>" class="btnEnviar">
        </div>
    </footer>
    <script type="module" src="/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</body>
</html>
